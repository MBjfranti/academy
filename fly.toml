# fly.toml — Barley & Bronze
#
# See https://fly.io/docs/reference/configuration/

app = 'barley-and-bronze'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # A static site with no state: scaling to zero costs a cold start and nothing else.
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # The generated file set BOTH memory = '1gb' and memory_mb = 256, which is a
  # contradiction in one block. nginx serving prebuilt files needs very little; 256 MB is
  # ample, and the build happens on the builder rather than here.
  memory_mb = 256
  cpu_kind = 'shared'
  cpus = 1
