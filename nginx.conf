# Barley & Bronze — nginx site config, copied to /etc/nginx/conf.d/default.conf.
#
# The one thing this file exists for is the SPA fallback at the bottom: every path on this
# site other than "/" is a React Router route with no file behind it, so an unknown path
# has to be answered with index.html and let the client resolve it.
#
# THE TRAP IN THAT, learned by shipping it: a naive fallback also swallows requests for
# files that are simply MISSING, and answers them 200 with a page of HTML. The favicon is
# where this bites first and least visibly. Chrome asks for /favicon.ico on its own,
# regardless of what <link rel="icon"> says; with a bare fallback that request succeeds,
# returns HTML, fails to decode as an image, and the browser quietly shows its default
# icon instead of the site's. Nothing errors and nothing is logged. Same for any hashed JS
# chunk that goes missing — answering a script request with HTML surfaces later as a
# syntax error somewhere unrelated to the actual problem.
#
# So: a client route never has a file extension, and anything that asks for one is an
# asset. If it is not on disk it gets a 404, which is both true and findable.
#
# LOCATION PRECEDENCE MATTERS HERE. nginx checks regex locations AFTER ordinary prefix
# locations but lets them WIN, so the extension rule below would otherwise capture
# /assets/, /fonts/ and /img/ and strip their Cache-Control. The "^~" on those three stops
# regex matching once the prefix matches, which is the whole reason for it.

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compress what compresses. Not the webp — already compressed, and gzipping it just
  # spends CPU to make it very slightly bigger.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Vite writes content-hashed filenames here, so a given URL's bytes never change and
  # the cache can be told to keep them permanently.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Subset webfonts. Same reasoning — the filenames are stable and the bytes are not
  # going to change under them.
  location ^~ /fonts/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The photographs and plates are keyed by SLUG, not by hash, so a re-shot picture can
  # reuse a filename. A day is long enough to be worth having and short enough that a
  # replacement is not stuck behind it.
  location ^~ /img/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # index.html carries the references to the hashed assets, so caching it is how a deploy
  # ends up serving new HTML to some visitors and stale HTML to others. This is an exact
  # match, which outranks everything below, and it catches the fallback's internal
  # redirect as well as a direct request.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The site's own mark. Served with a short cache so a rebrand is not stuck in tab strips
  # for a year, and named explicitly so it cannot be mistaken for a route.
  location = /favicon.svg {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # Anything asking for a file by extension is an asset request, not a page. If it is not
  # there, say so. /favicon.ico lands here and gets an honest 404, which browsers handle
  # correctly by falling back to the declared SVG.
  location ~* \.[a-z0-9]+$ {
    try_files $uri =404;
  }

  # Everything else is a client route: a real file if there is one, otherwise the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
