# Barley & Bronze — nginx site config, copied to /etc/nginx/conf.d/default.conf.
#
# The one thing this file exists for is the SPA fallback at the bottom: every path on this
# site other than "/" is a React Router route with no file behind it, so an unknown path
# has to be answered with index.html and let the client resolve it.
#
# The asset locations above it are deliberately NOT part of that fallback. If a hashed JS
# chunk goes missing, handing back index.html would answer a script request with HTML and
# a 200, and the failure would surface somewhere unrelated as a syntax error. A 404 is the
# honest answer and says where the problem is.

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compress what compresses. Not the webp — already compressed, and gzipping it just
  # spends CPU to make it very slightly bigger.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Vite writes content-hashed filenames here, so a given URL's bytes never change and
  # the cache can be told to keep them permanently.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Subset webfonts. Same reasoning — the filenames are stable and the bytes are not
  # going to change under them.
  location /fonts/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The photographs and plates are keyed by SLUG, not by hash, so a re-shot picture can
  # reuse a filename. A day is long enough to be worth having and short enough that a
  # replacement is not stuck behind it.
  location /img/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # index.html carries the references to the hashed assets, so caching it is how a deploy
  # ends up serving new HTML to some visitors and stale HTML to others.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Everything else: a real file if there is one, otherwise the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
