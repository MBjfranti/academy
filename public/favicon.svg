<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- BARLEY & BRONZE.

     The ampersand out of the site's own Eczar, as outlines: a favicon loads outside the
     page, where the webfont is not. Weight 800 rather than the masthead's 700, because
     at 16px the lighter cut thins out and this one holds.

     NO BACKGROUND CHIP. A rounded rectangle behind the glyph spends a third of a 16px
     budget on its own border and makes the thing read as an app icon. Full bleed on
     transparent lets the mark be as large as the box allows and sit on whatever ground
     the browser paints.

     BOTH THEMES. The two fills are the site's own copper tokens, light and dark, so the
     favicon tracks the browser chrome the same way the page tracks the reader's choice.
     A browser that ignores the media query gets the light value, which is the one that
     works on a light tab strip.

     NOTE FOR WHOEVER EDITS THIS: XML comments cannot contain two hyphens in a row, so a
     CSS custom property written out in full here silently breaks the whole file. Ask me
     how I know. -->
<style>
  .amp { fill: #A45320; }
  @media (prefers-color-scheme: dark) { .amp { fill: #E9A063; } }
</style>
